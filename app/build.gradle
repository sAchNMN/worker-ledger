plugins {
    id 'com.android.application'
}

import java.util.Properties

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        .every { keystoreProperties.getProperty(it) }
}

android {
    namespace 'com.workerledger.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.workerledger.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0'
    }

    buildFeatures {
        buildConfig true
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
